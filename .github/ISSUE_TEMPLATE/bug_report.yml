name: 🐛 Bug Report
description: Report a bug or unexpected behavior in LifeCircle OS.
title: "[BUG]: "
labels: ["bug", "triage"]
assignees:
  - krishnatiwari

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the form below to help us diagnose and fix the issue.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system is affected?
      options:
        - Backend API
        - Frontend UI
        - Authentication / Session
        - Family Management
        - E2E Tests
        - CI/CD Pipeline
        - Infrastructure (Docker / Database)
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical (system down, data loss)
        - High (major feature broken, no workaround)
        - Medium (feature impaired, workaround exists)
        - Low (cosmetic, minor inconvenience)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Navigate to '...'
        2. Click on '...'
        3. Observe '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide relevant environment details.
      placeholder: |
        - OS: macOS 15.x
        - Python: 3.12.x
        - Browser: Chrome 130.x
        - Node.js: 22.x (if E2E related)
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Attach any relevant logs, error messages, or screenshots.
    validations:
      required: false
