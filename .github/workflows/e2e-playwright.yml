# ──────────────────────────────────────────────────────────────────────────────
# LifeCircle OS — E2E Playwright Pipeline
#
# Full-stack E2E validation using ephemeral PostgreSQL + Redis service
# containers. Playwright runs headless Chromium with CI-optimized diagnostics:
#   retries: 2 (CI only), trace: on-first-retry, video: retain-on-failure
#
# Artifacts (HTML report, traces, screenshots, videos) retained for 14 days.
#
# Required GitHub Secrets:
#   JWT_SECRET — HMAC signing key (≥32 chars) for backend JWT generation
#
# Governed by: OPERATING_AGREEMENT.md | Sentinel QA EOS Governance
# ──────────────────────────────────────────────────────────────────────────────

name: E2E Playwright

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/e2e-playwright.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/e2e-playwright.yml'

permissions:
  contents: read

jobs:
  e2e-playwright:
    name: "E2E Playwright Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lifecircle_test
          POSTGRES_USER: lifecircle
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifecircle -d lifecircle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Backend configuration for CI
      DATABASE_URL: "postgresql+asyncpg://lifecircle:ci_test_password@localhost:5432/lifecircle_test"
      REDIS_URL: "redis://localhost:6379/0"
      RABBITMQ_URL: "amqp://guest:guest@localhost:5672/"
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APP_ENV: "test"
      # Frontend configuration
      BACKEND_API_URL: "http://localhost:8000"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2

      # ── Python Setup ─────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      # ── Backend Setup ────────────────────────────────────────────────────
      - name: Install backend dependencies
        working-directory: apps/api
        run: poetry install --no-interaction --no-root

      - name: Run database migrations
        working-directory: apps/api
        run: poetry run alembic upgrade head

      - name: Start backend server
        working-directory: apps/api
        run: |
          poetry run uvicorn lifecircle.main:create_app \
            --factory --host 127.0.0.1 --port 8000 &
          sleep 5
          curl --fail --silent http://127.0.0.1:8000/health || exit 1

      # ── Frontend Setup ───────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: poetry install --no-interaction --no-root

      - name: Start frontend server
        working-directory: apps/frontend
        run: |
          poetry run uvicorn lifecircle_frontend.main:app \
            --host 127.0.0.1 --port 8001 &
          sleep 3

      # ── Node.js & Playwright Setup ───────────────────────────────────────
      - name: Set up Node.js LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: "lts/*"

      - name: Install E2E dependencies
        working-directory: apps/frontend/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/frontend/e2e
        run: npx playwright install chromium --with-deps

      # ── Execute E2E Tests ────────────────────────────────────────────────
      - name: Run Playwright tests
        working-directory: apps/frontend/e2e
        env:
          CI: "true"
          FRONTEND_URL: "http://localhost:8001"
          BACKEND_URL: "http://localhost:8000"
        run: npx playwright test --project=chromium

      # ── Upload Artifacts ─────────────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: playwright-report
          path: apps/frontend/e2e/playwright-report/
          retention-days: 14

      - name: Upload test results (traces, screenshots, videos)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: playwright-test-results
          path: apps/frontend/e2e/test-results/
          retention-days: 14

  # ── Job 2: Aggregator Status Check ─────────────────────────────────────────
  e2e-status-check:
    name: "E2E Playwright Status Check"
    needs:
      - e2e-playwright
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ One or more dependencies failed or were cancelled."
            exit 1
          fi
          echo "✅ All dependencies passed."
          exit 0
