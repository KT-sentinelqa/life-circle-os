# ──────────────────────────────────────────────────────────────────────────────
# LifeCircle OS — Frontend CI Pipeline
#
# Triggers on pushes to main and PRs targeting main when frontend files change.
# Two deterministic jobs with unique names for branch protection enforcement.
#
# Required GitHub Secrets: (none — unit tests use mocked backend)
# Governed by: OPERATING_AGREEMENT.md | Sentinel QA EOS Governance
# ──────────────────────────────────────────────────────────────────────────────

name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/src/**'
      - 'apps/frontend/tests/**'
      - 'apps/frontend/pyproject.toml'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/src/**'
      - 'apps/frontend/tests/**'
      - 'apps/frontend/pyproject.toml'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/frontend

jobs:
  # ── Job 1: Lint & Type Check ───────────────────────────────────────────────
  frontend-lint:
    name: "Frontend Lint & Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5.3.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.1
        with:
          path: ~/.cache/pypoetry
          key: frontend-poetry-${{ hashFiles('apps/frontend/poetry.lock') }}
          restore-keys: frontend-poetry-

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Ruff check
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: MyPy strict type check
        run: poetry run mypy src

  # ── Job 2: Unit Tests & Coverage ───────────────────────────────────────────
  frontend-test:
    name: "Frontend Tests & Coverage"
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5.3.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.1
        with:
          path: ~/.cache/pypoetry
          key: frontend-poetry-${{ hashFiles('apps/frontend/poetry.lock') }}
          restore-keys: frontend-poetry-

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run tests with branch coverage
        run: |
          poetry run pytest \
            --cov=src \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=junit.xml \
            --cov-fail-under=90 \
            -vv

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: frontend-coverage
          path: |
            apps/frontend/coverage.xml
            apps/frontend/junit.xml
          retention-days: 14

  # ── Job 3: Aggregator Status Check ─────────────────────────────────────────
  frontend-status-check:
    name: "Frontend CI Status Check"
    needs:
      - frontend-lint
      - frontend-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ One or more dependencies failed or were cancelled."
            exit 1
          fi
          echo "✅ All dependencies passed."
          exit 0
