name: LifeCircle OS — Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'        # Production: v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'  # Release Candidate: v1.2.3-rc.1
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+' # Beta: v1.2.3-beta.1

env:
  FLUTTER_VERSION: '3.22.0'

jobs:
  # ============================================================
  # STEP 1 — Validate the tag format and extract version metadata
  # ============================================================
  validate_release:
    name: 'Release · Validate Tag'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      channel: ${{ steps.extract.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version and channel
        id: extract
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          if [[ "$TAG" == *"-rc."* ]]; then
            CHANNEL="rc"
          elif [[ "$TAG" == *"-beta."* ]]; then
            CHANNEL="beta"
          else
            CHANNEL="stable"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT

  # ============================================================
  # STEP 2 — Build signed release artifacts
  # ============================================================
  build_release_android:
    name: 'Release · Android AAB'
    needs: validate_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build Android App Bundle
        working-directory: apps/mobile
        run: flutter build appbundle --release

      - name: Generate SHA-256 checksum
        working-directory: apps/mobile/build/app/outputs/bundle/release
        run: sha256sum app-release.aab > app-release.aab.sha256

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifecircle-android-${{ needs.validate_release.outputs.version }}
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/app/outputs/bundle/release/app-release.aab.sha256

  # ============================================================
  # STEP 3 — Create GitHub Release with auto-generated changelog
  # ============================================================
  create_github_release:
    name: 'Release · Publish'
    needs: [validate_release, build_release_android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: lifecircle-android-${{ needs.validate_release.outputs.version }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'LifeCircle OS v${{ needs.validate_release.outputs.version }}'
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.validate_release.outputs.channel != 'stable' }}
          generate_release_notes: true
          files: dist/*
