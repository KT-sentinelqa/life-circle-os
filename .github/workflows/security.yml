# ──────────────────────────────────────────────────────────────────────────────
# LifeCircle OS — Security Pipeline (Phase 7)
#
# Consolidated security scanning: dependency audit, secret detection, and
# SBOM generation. Runs on PRs, pushes to main, and weekly.
#
# SEC-031: Every release artifact must generate and publish an SBOM and pass SAST.
# ──────────────────────────────────────────────────────────────────────────────

name: Security

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # ── Job 1: Secret Scanning ─────────────────────────────────────────────────
  secret-scan:
    name: "Secret Scanning (SEC-031)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # ── Job 2: Dependency Audit ────────────────────────────────────────────────
  dependency-audit:
    name: "Dependency Audit (SEC-031)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0'
      - name: Audit Dart/Flutter Dependencies
        working-directory: apps/mobile
        run: dart pub outdated --mode=security

  # ── Job 3: SBOM Generation ───────────────────────────────────────
  sbom-generate:
    name: "SBOM Generation (SEC-031)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scaffold SBOM Generation
        working-directory: apps/mobile
        run: echo "Generate CycloneDX SBOM here in production environment."
