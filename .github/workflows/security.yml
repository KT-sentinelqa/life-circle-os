# ──────────────────────────────────────────────────────────────────────────────
# LifeCircle OS — Security Pipeline
#
# Consolidated security scanning: dependency audit, secret detection, and
# SBOM generation (CycloneDX). Runs on PRs, pushes to main, and weekly.
#
# SEC-013: Every release artifact must generate and publish an SBOM.
# EOS-011: No TODO/FIXME in production code (enforced via grep check).
#
# Governed by: OPERATING_AGREEMENT.md | Sentinel QA EOS Governance
# ──────────────────────────────────────────────────────────────────────────────

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC — dependency vulnerability refresh
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # ── Job 1: Dependency Audit ────────────────────────────────────────────────
  dependency-audit:
    name: "Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend dependencies
        working-directory: apps/backend
        run: |
          poetry export -f requirements.txt --without-hashes -o requirements.txt
          pip-audit -r requirements.txt --desc on --output backend-audit.json --format json || true

      - name: Audit frontend dependencies
        working-directory: apps/frontend
        run: |
          poetry export -f requirements.txt --without-hashes -o requirements.txt
          pip-audit -r requirements.txt --desc on --output frontend-audit.json --format json || true

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: dependency-audit-reports
          path: |
            apps/backend/backend-audit.json
            apps/frontend/frontend-audit.json
          retention-days: 30

  # ── Job 2: Secret Scanning ─────────────────────────────────────────────────
  secret-scan:
    name: "Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run secret scan
        run: detect-secrets scan --all-files --exclude-files '\.lock$' --exclude-files '\.baseline$' > .secrets-scan-result.json

      - name: Check for high-entropy secrets
        run: |
          python -c "
          import json, sys
          with open('.secrets-scan-result.json') as f:
              data = json.load(f)
          results = data.get('results', {})
          total = sum(len(v) for v in results.values())
          if total > 0:
              print(f'WARNING: {total} potential secret(s) detected')
              for filename, findings in results.items():
                  for finding in findings:
                      print(f'  {filename}:{finding[\"line_number\"]} — {finding[\"type\"]}')
              sys.exit(1)
          print('No secrets detected.')
          "

  # ── Job 3: EOS-011 TODO/FIXME Check ───────────────────────────────────────
  code-hygiene:
    name: "Code Hygiene (EOS-011)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Check for prohibited TODO/FIXME in production code
        run: |
          echo "Scanning for EOS-011 violations (TODO/FIXME in production code)..."
          VIOLATIONS=$(grep -rn --include="*.py" -E "(TODO|FIXME|HACK|XXX)" \
            apps/backend/src/ apps/frontend/src/ \
            --exclude-dir=__pycache__ || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ EOS-011 VIOLATION: Prohibited markers found in production code:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ No EOS-011 violations detected."

  # ── Job 4: SBOM Generation (SEC-013) ───────────────────────────────────────
  sbom-generate:
    name: "SBOM Generation (SEC-013)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.12"

      - name: Install Poetry and CycloneDX
        run: |
          pipx install poetry
          pip install cyclonedx-bom

      - name: Generate backend SBOM
        working-directory: apps/backend
        run: |
          poetry export -f requirements.txt --without-hashes -o requirements.txt
          cyclonedx-py requirements -i requirements.txt -o backend-sbom.json --format json

      - name: Generate frontend SBOM
        working-directory: apps/frontend
        run: |
          poetry export -f requirements.txt --without-hashes -o requirements.txt
          cyclonedx-py requirements -i requirements.txt -o frontend-sbom.json --format json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: sbom-artifacts
          path: |
            apps/backend/backend-sbom.json
            apps/frontend/frontend-sbom.json
          retention-days: 90

  # ── Job 5: Aggregator Status Check ─────────────────────────────────────────
  security-status-check:
    name: "Security Pipeline Status Check"
    needs:
      - dependency-audit
      - secret-scan
      - code-hygiene
      - sbom-generate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ One or more dependencies failed or were cancelled."
            exit 1
          fi
          echo "✅ All dependencies passed."
          exit 0
