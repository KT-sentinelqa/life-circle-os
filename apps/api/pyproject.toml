[tool.poetry]
name = "life-circle-api"
version = "0.1.0"
description = "FastAPI Backend for Life Circle OS"
authors = ["Founder <founder@lifecircle.os>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "0.111.0"
uvicorn = {extras = ["standard"], version = "0.30.1"}
pydantic = "2.7.4"
pydantic-settings = "2.3.4"
asyncpg = "^0.29.0"
argon2-cffi = "^23.1.0"
redis = "^5.0.3"
pyjwt = "^2.8.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.30"}
greenlet = "^3.0.3"
python-multipart = "^0.0.18"
arq = "^0.26.0"
structlog = "^24.1.0"
aiosmtplib = ">=3.0.1,<6.0.0"
prometheus-client = "^0.20.0"
starlette-prometheus = "^0.10.0"
opentelemetry-api = "^1.24.0"
opentelemetry-sdk = "^1.24.0"
opentelemetry-instrumentation-fastapi = "^0.45b0"
opentelemetry-instrumentation-sqlalchemy = "^0.45b0"
opentelemetry-instrumentation-redis = "^0.45b0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4"
pytest-asyncio = "^1.1"
httpx = "^0.27.0"
pytest-cov = "^5.0"
black = "^25.0"
ruff = "^0.12"
mypy = "^1.16"
bandit = "^1.7.9"
alembic = "^1.13.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src --cov-fail-under=85"
testpaths = [
    "tests",
]
