# Alembic configuration file
# Governed by: docs/golden-path/database-change.md

[alembic]
# Path to migration scripts, relative to this alembic.ini
script_location = alembic

# Template for migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for timestamp in file names
timezone = UTC

# Max length of the migration slug
truncate_slug_length = 40

# Version locations (single path, feature-specific expansions in future)
version_locations = %(here)s/alembic/versions

# Database URL is sourced from the application settings at runtime.
# Do NOT set sqlalchemy.url here — it is injected via env.py.
sqlalchemy.url = driver://user:pass@localhost/dbname

# ── Logging ───────────────────────────────────────────────────────────────────
[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level     = WARN
handlers  = console
qualname  =

[logger_sqlalchemy]
level     = WARN
handlers  =
qualname  = sqlalchemy.engine

[logger_alembic]
level     = INFO
handlers  =
qualname  = alembic

[handler_console]
class     = StreamHandler
args      = (sys.stderr,)
level     = NOTSET
formatter = generic

[formatter_generic]
format    = %(levelname)-5.5s [%(name)s] %(message)s
datefmt   = %H:%M:%S
