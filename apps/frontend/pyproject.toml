[tool.poetry]
name        = "lifecircle-frontend"
version     = "0.1.0"
description = "LifeCircle OS — FastAPI + Jinja2 + HTMX frontend service"
authors     = ["Krishna Tiwari <krishna@lifecircle.app>"]
license     = "Proprietary"
readme      = "README.md"
packages    = [{ include = "lifecircle_frontend", from = "src" }]

[tool.poetry.dependencies]
python            = "^3.12"
fastapi           = "^0.111.0"
uvicorn           = { version = "^0.30.1", extras = ["standard"] }
jinja2            = "^3.1.4"
pydantic          = "^2.7.4"
pydantic-settings = "^2.3.4"
httpx             = "^0.27.0"
structlog         = "^24.2.0"
python-multipart  = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest              = "^8.2.2"
pytest-asyncio      = "^0.23.7"
pytest-cov          = "^5.0.0"
ruff                = "^0.4.9"
mypy                = "^1.10.0"
bandit              = "^1.9.4"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ── Ruff Configuration ────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length    = 100
src            = ["src"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle + pyflakes
  "I",              # isort
  "N",              # pep8-naming
  "UP",             # pyupgrade
  "B",              # flake8-bugbear
  "C4",             # flake8-comprehensions
  "S",              # flake8-bandit (security)
  "T20",            # flake8-print (no bare print)
  "RUF",            # ruff-specific
]
ignore = [
  "S101",  # assert in tests is acceptable
  "B008",  # FastAPI Depends() in default args
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "T20"]

# ── Mypy Configuration ────────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.12"
strict                 = true
ignore_missing_imports = true
plugins                = ["pydantic.mypy"]

# ── Pytest Configuration ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode    = "auto"
testpaths       = ["tests"]
python_files    = ["test_*.py"]
python_classes  = ["Test*"]
python_functions= ["test_*"]
addopts         = [
  "--strict-markers",
  "-ra",
  "--tb=short",
]
markers = [
  "unit: Pure unit tests (no I/O)",
  "integration: Tests requiring running infrastructure",
  "slow: Slow running tests",
  "asyncio: Asyncio test marker",
]

# ── Coverage Configuration ────────────────────────────────────────────────────
[tool.coverage.run]
source   = ["src"]
omit     = ["*/tests/*"]
branch   = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
