{% extends "base.html" %}

{% block content %}
<div class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl shadow-slate-950/40">
        <div class="text-center mb-8">
            <h2 class="font-display font-bold text-2xl text-white mb-2">Welcome Back</h2>
            <p class="text-sm text-slate-400">Access your secure LifeCircle account</p>
        </div>

        <!-- Registration Success Alert -->
        {% if registered %}
        <div class="mb-6 p-4 rounded-lg bg-green-500/10 border border-green-500/20 text-xs font-medium text-green-400" role="alert">
            Account created successfully! Please sign in below.
        </div>
        {% endif %}

        <!-- HTMX Target Form Container -->
        <div id="login-form-container">
            {% include "auth/partials/login_form.html" %}
        </div>

        <div class="mt-6 text-center text-xs text-slate-400">
            Don't have an account? <a href="/register" class="text-indigo-400 hover:text-indigo-300 font-medium transition">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
