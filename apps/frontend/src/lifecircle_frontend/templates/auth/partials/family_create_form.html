<form hx-post="/family/create" hx-target="#family-form-container" hx-swap="innerHTML" class="space-y-6">
    <!-- CSRF Protection Double-Submit Token -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    {% if errors and errors.general %}
    <div class="p-3.5 rounded-lg bg-red-500/10 border border-red-500/20 text-xs font-medium text-red-400" role="alert">
        {{ errors.general }}
    </div>
    {% endif %}

    <div>
        <label for="name" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Family Name</label>
        <input type="text" id="name" name="name" value="{{ name or '' }}" required placeholder="e.g. Tiwari Family"
               class="w-full bg-slate-950 border {% if errors and errors.name %}border-red-500/50{% else %}border-slate-800{% endif %} rounded-lg px-4 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition duration-150">
        {% if errors and errors.name %}
        <span class="text-[11px] font-medium text-red-400 mt-1.5 block" role="alert">{{ errors.name }}</span>
        {% endif %}
    </div>

    <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold py-2.5 rounded-lg shadow-lg shadow-indigo-600/10 transition duration-150 flex items-center justify-center gap-2">
        <span class="htmx-indicator animate-spin w-4 h-4 border-2 border-white/20 border-t-white rounded-full hidden"></span>
        Create Family
    </button>
</form>
