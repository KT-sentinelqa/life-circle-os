<header class="sticky top-0 z-50 w-full border-b border-slate-800 bg-slate-950/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <!-- Glassmorphic App Icon -->
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <span class="font-display font-bold text-white text-lg">LC</span>
            </div>
            <a href="/" class="font-display font-bold text-xl tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-100 to-slate-400">
                LifeCircle <span class="text-indigo-400 text-sm font-semibold tracking-normal">OS</span>
            </a>
        </div>
        <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-300">
            <a href="/dashboard" class="hover:text-white transition">Dashboard</a>
            <a href="/family/create" class="hover:text-white transition">Create Family</a>
        </nav>
        <div class="flex items-center gap-4">
            {% if user %}
            <span class="text-xs text-slate-400 font-medium hidden sm:inline">Hi, {{ user.email }}</span>
            <form action="/logout" method="POST" class="inline">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button type="submit" class="text-sm font-medium hover:text-white transition">Sign Out</button>
            </form>
            {% else %}
            <a href="/login" class="text-sm font-medium hover:text-white transition">Sign In</a>
            <a href="/register" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-lg shadow-lg shadow-indigo-600/20 transition duration-150">
                Get Started
            </a>
            {% endif %}
        </div>
    </div>
</header>
