name: lifecircle_mobile
description: LifeCircle OS — Family life management mobile application
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ────────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # ── Local Storage ───────────────────────────────────────────────────────────
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # ── Networking ──────────────────────────────────────────────────────────────
  dio: ^5.4.3+1

  # ── Secure Storage & Encryption ─────────────────────────────────────────────
  flutter_secure_storage: ^9.0.0
  encrypt: ^5.0.3

  # ── Connectivity ────────────────────────────────────────────────────────────
  connectivity_plus: ^6.0.3

  # ── Routing ─────────────────────────────────────────────────────────────────
  go_router: ^14.2.0

  # ── Localisation ────────────────────────────────────────────────────────────
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  flutter_lints: ^4.0.0
  very_good_analysis: ^6.0.0
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
