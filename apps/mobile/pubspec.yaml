name: lifecircle_mobile
description: LifeCircle OS — Family life management mobile application
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  clock: ^1.1.1
  connectivity_plus: ^6.0.3
  crypto: ^3.0.3
  dio: ^5.4.3+1
  encrypt: ^5.0.3
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  flutter_local_notifications: ^17.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.0.0
  freezed_annotation: ^2.4.1
  go_router: ^14.2.0
  intl: ^0.20.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  json_annotation: ^4.9.0
  path: ^1.9.0
  path_provider: ^2.1.3
  pretty_dio_logger: ^1.3.3
  riverpod_annotation: ^2.3.5
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  uuid: ^4.4.0

dev_dependencies:
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  isar_generator: ^3.1.0+1
  json_serializable: ^6.8.0
  mocktail: ^1.0.3
  riverpod_generator: ^2.4.0
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env.dev
    - .env.staging
    - .env.prod
