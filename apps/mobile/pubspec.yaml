name: lifecircle_mobile
description: LifeCircle OS — Family life management mobile application
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ────────────────────────────────────────────────────────
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # ── Local Storage ───────────────────────────────────────────────────────────
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # ── Networking ──────────────────────────────────────────────────────────────
  dio: ^5.4.3+1

  # ── Secure Storage ──────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.0.0

  # ── Localisation ────────────────────────────────────────────────────────────
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  very_good_analysis: ^6.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
